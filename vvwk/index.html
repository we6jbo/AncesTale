<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VVWK enrollment closed</title><h1>VVWK · Enrollment closed</h1><p>No new players can enroll. Existing browser cookies remain valid until their original expiration. You can check recognition or remove your enrollment below. Game pages record last activity for enrolled players.</p><button id="check">Check existing enrollment</button> <button id="remove">Delete my enrollment</button><p id="status" role="status"></p><script>
async function request(action){try{const r=await fetch('./api/enrollment',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,page:location.pathname})});const d=await r.json();document.getElementById('status').textContent=d.message+(d.name?' — '+d.name:'');}catch(e){document.getElementById('status').textContent='Recognition unavailable';}}
document.getElementById('check').onclick=()=>request('heartbeat');document.getElementById('remove').onclick=()=>{if(confirm('Remove this enrollment? New enrollment is closed.'))request('delete');};
</script></html>
